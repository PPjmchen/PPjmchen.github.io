<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to jiaming-chen.com</title>
  <link rel="canonical" href="https://jiaming-chen.com/">
  <meta http-equiv="refresh" content="0; url=https://jiaming-chen.com/">
  <script>
    const target = new URL("https://jiaming-chen.com/");
    target.pathname = window.location.pathname;
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.toString());
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #f7f3e7;
    }
    main {
      width: min(560px, calc(100% - 40px));
      border: 3px solid #111;
      background: #fff;
      padding: 28px;
      box-shadow: 8px 8px 0 #111;
    }
    a {
      color: #9f1714;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Redirecting</h1>
    <p>This page has moved to <a href="https://jiaming-chen.com/">jiaming-chen.com</a>.</p>
  </main>
</body>
</html>
